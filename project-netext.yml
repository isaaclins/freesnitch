# Per-process firewall flavour: the monitor app PLUS the Network System
# Extension. This build requires two Apple-issued Developer ID provisioning
# profiles (one for io.isaaclins.freesnitch with the Network Extensions and
# System Extension capabilities, one for io.isaaclins.freesnitch.netext with
# Network Extensions) embedded in the respective bundles. Without them macOS
# refuses to launch the app, which is why the shipping DMG is built from
# project.yml instead. See docs/NETWORK-EXTENSION.md.
#
#   xcodegen generate --spec project-netext.yml
#
include:
  - project.yml

targets:
  FreeSnitchNetExt:
    settings:
      base:
        PROVISIONING_PROFILE_SPECIFIER: "FreeSnitch NetExt DeveloperID"
        CODE_SIGN_STYLE: Manual

  FreeSnitch:
    entitlements:
      path: Sources/GUI/FreeSnitch-netext.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.developer.networking.networkextension:
          - content-filter-provider-systemextension
        com.apple.developer.system-extension.install: true
        com.apple.security.application-groups:
          - BHAF4L4726.io.isaaclins.freesnitch
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Sources/GUI/FreeSnitch-netext.entitlements
        # Restricted entitlements are only accepted when the matching profile is
        # named here; copying it into the bundle afterwards is not enough.
        PROVISIONING_PROFILE_SPECIFIER: "FreeSnitch App DeveloperID"
        CODE_SIGN_STYLE: Manual
    # project.yml already declares the helper dependency, and xcodegen merges
    # the two lists, so re-declaring it here fails spec validation with
    # 'has the dependency "FreeSnitchHelper" multiple times'.
    dependencies:
      - target: FreeSnitchNetExt
        embed: true
