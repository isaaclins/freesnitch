name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer run supersedes an older one of the same kind on the same ref, so
# stale jobs stop instead of holding the few macOS runners: a new push to a
# pull request, a new push to main and a new dispatch for the same branch
# each cancel the run before it. Pushes and dispatches get separate groups,
# so a dispatch on main never cancels the push run it was started next to.
# Every run still checks out exactly the commit its event names.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  firewall-safety:
    name: Firewall safety audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The audit searches the sources with ripgrep, which the Ubuntu
      # runner image does not ship.
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Audit fail-open firewall invariants
        run: bash Scripts/audit_firewall_safety.sh

  harness:
    name: Test harnesses (group ${{ matrix.group }} of 4)
    # macOS runners are few and shared, a run here takes five of them, and a
    # pull request gets several pushes while it is reviewed: on 2026-11-25
    # macOS jobs waited about 50 minutes in the queue for 11 minutes of work.
    # So on pull requests from this repo the macOS jobs run once, right before
    # merging, on the branch brought up to date with main (`gh workflow run
    # build.yml --ref <branch>`; a manual run tests the branch itself, not the
    # merge with main), and on every push to main. Pull requests from forks
    # still run them at once.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # macos-15, not macos-26: see .github/actions/select-xcode. The same
    # Xcode 26 toolchain and SDK are selected there.
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      # Several harnesses filter with ripgrep. Install it explicitly rather
      # than rely on the runner image: without it one harness would hide its
      # own compile errors.
      - name: Install ripgrep
        run: command -v rg >/dev/null || brew install ripgrep

      # Every Scripts/test_*.sh runs, so a new harness is covered the day it
      # lands. They are split over four macOS jobs instead of one per
      # harness to keep the queue short on shared runners. Each group
      # runs all of its harnesses and lists every one that failed.
      #
      # The harnesses compile the shipping sources with swiftc and run them
      # as the runner user. None of them needs root: privileged tools are
      # stubbed, and pfctl is only ever asked to parse (-n), never to load.
      - name: Run this group's harnesses
        env:
          GROUP: ${{ matrix.group }}
          GROUP_COUNT: 4
        run: |
          scripts=()
          while IFS= read -r f; do scripts+=("$f"); done < <(find Scripts -maxdepth 1 -name 'test_*.sh' -print | sort)
          if [ "${#scripts[@]}" -eq 0 ]; then echo 'ERROR: no Scripts/test_*.sh found.'; exit 1; fi
          failed=()
          ran=0
          for i in "${!scripts[@]}"; do
            [ $(( i % GROUP_COUNT + 1 )) -eq "$GROUP" ] || continue
            f="${scripts[$i]}"
            ran=$((ran + 1))
            echo "::group::$f"
            if bash "$f"; then status=0; else status=$?; fi
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              echo "PASS $f"
            else
              echo "::error file=$f::$f failed (exit $status)"
              failed+=("$f")
            fi
          done
          echo "group $GROUP ran $ran of ${#scripts[@]} harnesses"
          if [ "${#failed[@]}" -gt 0 ]; then
            printf 'FAILED: %s\n' "${failed[@]}"
            exit 1
          fi

  # One stable check name for every harness group, so branch protection can
  # require it without listing the groups.
  harnesses:
    name: Test harnesses
    needs: harness
    # Skipped with the harnesses on a pull request push (see above).
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every harness to pass
        run: |
          echo "harness matrix result: ${{ needs.harness.result }}"
          [ "${{ needs.harness.result }}" = success ]

  monitor-build:
    name: Build monitor flavour
    # Runs when the harnesses run (see above).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # macos-15, not macos-26: see .github/actions/select-xcode. Xcode 26
    # crashes compiling the Icon Composer icon (Resources/AppIcon.icon) on a
    # macOS 15 host, so this build leaves it out and uses AppIcon.appiconset,
    # exactly like a build with an Xcode older than 26. app-icon.yml builds
    # with the Icon Composer icon on macos-26 whenever a change can affect it.
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate monitor project
        run: xcodegen generate --spec project.yml

      - name: Build monitor app without signing or profiles
        run: |
          xcodebuild \
            -project FreeSnitch.xcodeproj \
            -scheme FreeSnitch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/monitor \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            PROVISIONING_PROFILE_SPECIFIER='' \
            EXCLUDED_SOURCE_FILE_NAMES=AppIcon.icon \
            build

      - name: Verify monitor bundle has no restricted entitlements
        run: |
          APP=build/monitor/Build/Products/Release/FreeSnitch.app
          test -d "$APP"
          test -f "$APP/Contents/MacOS/FreeSnitch"
          test -f "$APP/Contents/MacOS/FreeSnitchHelper"
          test -f "$APP/Contents/Helpers/freesnitch"
          file "$APP/Contents/Helpers/freesnitch" | grep -Fq 'Mach-O'
          status=0
          grep -R -E -q \
            'com\.apple\.developer\.networking\.networkextension|com\.apple\.developer\.system-extension\.install' \
            "$APP" || status=$?
          case "$status" in
            0) echo 'ERROR: restricted Network Extension entitlement leaked into the monitor build.'; exit 1 ;;
            1) ;;
            *) echo "ERROR: entitlement scan of the monitor bundle failed (grep exit status $status)."; exit 1 ;;
          esac
          echo 'Monitor bundle verified without profiles or restricted entitlements.'
