name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  firewall-safety:
    name: Firewall safety audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Audit fail-open firewall invariants
        run: bash Scripts/audit_firewall_safety.sh

  monitor-build:
    name: Build monitor flavour
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate monitor project
        run: xcodegen generate --spec project.yml

      - name: Build monitor app without signing or profiles
        run: |
          xcodebuild \
            -project PureSnitch.xcodeproj \
            -scheme PureSnitch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/monitor \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            PROVISIONING_PROFILE_SPECIFIER='' \
            build

      - name: Verify monitor bundle has no restricted entitlements
        run: |
          APP=build/monitor/Build/Products/Release/PureSnitch.app
          test -d "$APP"
          test -f "$APP/Contents/MacOS/PureSnitch"
          test -f "$APP/Contents/MacOS/PureSnitchHelper"
          if grep -R -E -q \
            'com\.apple\.developer\.networking\.networkextension|com\.apple\.developer\.system-extension\.install' \
            "$APP"; then
            echo 'ERROR: restricted Network Extension entitlement leaked into the monitor build.'
            exit 1
          fi
          echo 'Monitor bundle verified without profiles or restricted entitlements.'
