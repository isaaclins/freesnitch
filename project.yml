name: FreeSnitch
options:
  bundleIdPrefix: io.isaaclins.freesnitch
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  defaultConfig: Release
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: BHAF4L4726
    SWIFT_VERSION: "5.10"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: "arm64 x86_64"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    SWIFT_STRICT_CONCURRENCY: minimal
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO

fileGroups:
  - Sources
  - Resources
  - Scripts

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.7.1

targets:
  FreeSnitch:
    type: application
    platform: macOS
    sources:
      - path: Sources/GUI
      - path: Sources/Shared
      - path: Resources/Assets.xcassets
    info:
      path: Sources/GUI/Info.plist
      properties:
        CFBundleName: FreeSnitch
        CFBundleDisplayName: FreeSnitch
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "27"
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 FreeSnitch contributors. MIT License."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Only used to place the "your Mac" node on the connection map. The
        # map degrades to endpoints without lines when this is refused.
        NSLocationWhenInUseUsageDescription: "FreeSnitch shows your Mac on the connection map so you can see where your traffic goes."
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.utilities
        SUFeedURL: "https://isaaclins.com/freesnitch/appcast.xml"
        SUPublicEDKey: "4tyy5OVCWUs8cUsqCW22ce2IxVmhNZbBxJkoBlftIz8="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAllowsAutomaticUpdates: false
    entitlements:
      path: Sources/GUI/FreeSnitch.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        # NOTE: com.apple.developer.networking.networkextension and
        # com.apple.developer.system-extension.install are deliberately absent.
        # They are restricted entitlements: without an Apple-issued
        # provisioning profile embedded in the bundle, AMFI can refuse to start
        # the process at all, and the app simply never opens for the user. They
        # come back only together with the two Developer ID profiles (app and
        # extension); see docs/NETWORK-EXTENSION.md.
        com.apple.security.application-groups:
          - BHAF4L4726.io.isaaclins.freesnitch
    settings:
      base:
        # Xcode 27 no longer falls back to the target name here: without an
        # explicit PRODUCT_NAME the Swift module name resolves to "" and the
        # build fails with 'Module name "" is not a valid identifier'.
        PRODUCT_NAME: FreeSnitch
        PRODUCT_MODULE_NAME: FreeSnitch
        PRODUCT_BUNDLE_IDENTIFIER: io.isaaclins.freesnitch
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_IDENTITY: "Developer ID Application: isaac lins (BHAF4L4726)"
        CODE_SIGN_ENTITLEMENTS: Sources/GUI/FreeSnitch.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Embed Provisioning Profile
        runOnlyWhenInstalling: false
        script: |
          set -e
          # Restricted entitlements (Network Extension, System Extension) are
          # only honoured when an Apple-issued profile is embedded in the
          # bundle. Without it AMFI can refuse to start the process at all.
          PROFILE="${SRCROOT}/Profiles/app.provisionprofile"
          if [ -f "$PROFILE" ]; then
            cp -f "$PROFILE" "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/Contents/embedded.provisionprofile"
          else
            echo "warning: $PROFILE not found, building without an embedded profile"
          fi
      - name: Embed Helper
        runOnlyWhenInstalling: false
        script: |
          set -e
          APP="${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}"
          HELPER_BIN="${BUILT_PRODUCTS_DIR}/FreeSnitchHelper"
          if [ -f "$HELPER_BIN" ]; then
            mkdir -p "$APP/Contents/MacOS"
            cp -f "$HELPER_BIN" "$APP/Contents/MacOS/FreeSnitchHelper"
            mkdir -p "$APP/Contents/Library/LaunchDaemons"
            cp -f "${SRCROOT}/Sources/Helper/Launchd.plist" "$APP/Contents/Library/LaunchDaemons/io.isaaclins.freesnitch.helper.plist"
          else
            echo "warning: helper binary not found, skipping embed"
          fi
      - name: Embed CLI
        runOnlyWhenInstalling: false
        script: |
          set -e
          APP="${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}"
          CLI_BIN="${BUILT_PRODUCTS_DIR}/FreeSnitchCLI"
          if [ -f "$CLI_BIN" ]; then
            mkdir -p "$APP/Contents/Helpers"
            cp -f "$CLI_BIN" "$APP/Contents/Helpers/freesnitch"
          else
            echo "warning: CLI binary not found, skipping embed"
          fi
    dependencies:
      - package: Sparkle
      - target: FreeSnitchHelper
        embed: false
        link: false
      - target: FreeSnitchCLI
        embed: false
        link: false
      # This spec is the contributor build and deliberately omits the system
      # extension, so the app can be built without this team's Developer ID
      # provisioning profiles. Shipping releases are not built from here:
      # Scripts/release.sh generates the firewall flavour with
      #   xcodegen generate --spec project-netext.yml

  FreeSnitchNetExt:
    type: system-extension
    platform: macOS
    sources:
      - path: Sources/NetExt
        excludes:
          - "*.md"
      - path: Sources/Shared
    info:
      path: Sources/NetExt/Info.plist
      properties:
        CFBundleName: FreeSnitchNetExt
        CFBundleDisplayName: FreeSnitch Network Extension
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "27"
        CFBundlePackageType: SYSX
        LSMinimumSystemVersion: "13.0"
        NSSystemExtensionUsageDescription: "FreeSnitch filters per-app network connections."
        NetworkExtension:
          NEMachServiceName: BHAF4L4726.io.isaaclins.freesnitch.ipc
          NEProviderClasses:
            com.apple.networkextension.filter-data: FreeSnitchNetExt.FilterDataProvider
    entitlements:
      path: Sources/NetExt/NetExt.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - BHAF4L4726.io.isaaclins.freesnitch
        com.apple.developer.networking.networkextension:
          - content-filter-provider-systemextension
    settings:
      base:
        # sysextd matches an embedded extension by FILENAME, not by the
        # identifier in its Info.plist, so the bundle has to be called
        # <bundle id>.systemextension. Named anything else, activation fails
        # with "Extension not found in App bundle" even though the bundle is
        # right there with the correct identifier, entitlements and signature.
        PRODUCT_NAME: io.isaaclins.freesnitch.netext
        PRODUCT_BUNDLE_IDENTIFIER: io.isaaclins.freesnitch.netext
        PRODUCT_MODULE_NAME: FreeSnitchNetExt
        CODE_SIGN_IDENTITY: "Developer ID Application: isaac lins (BHAF4L4726)"
        CODE_SIGN_ENTITLEMENTS: Sources/NetExt/NetExt.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
    postBuildScripts:
      - name: Embed Provisioning Profile
        runOnlyWhenInstalling: false
        script: |
          set -e
          PROFILE="${SRCROOT}/Profiles/netext.provisionprofile"
          if [ -f "$PROFILE" ]; then
            cp -f "$PROFILE" "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/Contents/embedded.provisionprofile"
          else
            echo "warning: $PROFILE not found, building without an embedded profile"
          fi

  FreeSnitchHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Helper
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_NAME: FreeSnitchHelper
        PRODUCT_BUNDLE_IDENTIFIER: io.isaaclins.freesnitch.helper
        CODE_SIGN_IDENTITY: "Developer ID Application: isaac lins (BHAF4L4726)"
        CODE_SIGN_ENTITLEMENTS: Sources/Helper/Helper.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS: "-sectcreate __TEXT __info_plist $(SRCROOT)/Sources/Helper/Info.plist -sectcreate __TEXT __launchd_plist $(SRCROOT)/Sources/Helper/Launchd.plist"

  FreeSnitchCLI:
    type: tool
    platform: macOS
    sources:
      - path: Sources/CLI
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_NAME: FreeSnitchCLI
        PRODUCT_BUNDLE_IDENTIFIER: io.isaaclins.freesnitch.cli
        CODE_SIGN_IDENTITY: "Developer ID Application: isaac lins (BHAF4L4726)"
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_CODE_SIGN_FLAGS: "--timestamp --identifier io.isaaclins.freesnitch.cli"
        SKIP_INSTALL: YES
